<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>MSN2.0 : Inscription</title>

		<!-- CSS: -->
		<link href="../css/base.css" rel="stylesheet" />
		<link href="../css/connexion.css" rel="stylesheet" />

		<!-- ? Charge la bibliothèque Supabase -->
		<!-- ! Ordre important : bibliothèque, puis supabase.js, puis inscription.js -->
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script src="../js/supabase.js"></script>
		<script type="module" src="../js/inscription.js"></script>
	</head>

	<body>
		<header>
			<div id="sticker">
				<img src="../images/title.gif" alt="MSN2.0" name="websiteTitle" />
			</div>
		</header>
		<div class="layout">
			<main>
				<br />
				<h1>Inscription</h1>
				<!-- ? Formulaire de création de compte -->
				<form id="signup-form">
					<br /><input id="email" type="email" placeholder="example@yahoo.com" autocomplete="email" required aria-label="Courriel" /> <br />
					<input id="mdp" type="password" placeholder="mot de passe" autocomplete="new-password" required aria-label="Mot de passe" />
					<!-- * alert_box : affiche les erreurs de validation du mot de passe -->
					<p id="alert_box"></p>
					<input id="confirmmdp" type="password" placeholder="confirmer votre mot de passe" autocomplete="new-password" required aria-label="Confirmation du mot de passe" /> <br />
					<button class="action-button-inscription" type="submit">créér mon compte</button><br />
					<!-- * message de succès après la création du compte-->
					<p id="created_message"></p>
				</form>
				<a class="page-link" href="./connexion.html">J'ai déjà un compte</a>
			</main>
		</div>
		<script src="../js/drag.js"></script>
	</body>
</html>
