<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSN2.0 : Connexion</title>

    <!-- CSS: -->
    <link href="../css/base.css" rel="stylesheet" />
    <link href="../css/connexion.css" rel="stylesheet" />

    <!--Connexion a supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script type="module" src="../js/connexion.js"></script>
  </head>

  <body>
    <header>
      <div id="sticker">
        <img src="../images/title.gif" name="websiteTitle" align="left" />
      </div>
    </header>
    <div class="layout">
      <main>
        <br />
        <h1>Connexion</h1>
        <form id="login-form">
          <br /><input
            id="email"
            type="email"
            placeholder="example@yahoo.com"
          /><br />
          <input id="mdp" type="password" placeholder="mot de passe" /><br />
          <p id="alert_box"></p>
          <button class="action-button-connexion" type="submit">
            Me connecter</button
          ><br />
        </form>
        <a class="page-link" href="../pages/inscription.html"
          >Créer un compte</a
        >
      </main>
    </div>
    <script src="../js/drag.js"></script>
  </body>
</html>
